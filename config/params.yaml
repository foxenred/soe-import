# Параметры модели. Все данные модельные.
# Правило: число, которого нет во входных данных или в источнике со ссылкой, — допущение.
# Такое значение помечается комментарием «# ДОПУЩЕНИЕ» и попадает в таблицу допущений отчета.

seed: 42  # фиксированное зерно генератора: результаты воспроизводятся
# География
geography:
  tortuosity: 1.25           # ДОПУЩЕНИЕ: ж/д расстояние = большой круг × 1,25 (чувствительность 1,15–1,4)
# Ставки-ориентиры
rates:
  truck_rub_km: 100          # ДОПУЩЕНИЕ: переброска остатков автомобилем 20 т, ₽/км (чувствительность 70–150)
  truck_speed_km_day: 600    # ДОПУЩЕНИЕ: скорость автоперевозки, км/сут
  road_tortuosity: 1.2       # ДОПУЩЕНИЕ: дорога = большой круг × 1,2
  truck_load_days: 1         # ДОПУЩЕНИЕ: сбор и погрузка автомобиля, сут
# Товар и окно продаж
season:
  start: "2026-11-01"        # ДОПУЩЕНИЕ: окно продаж 1 ноября — 31 декабря
  end: "2026-12-31"
  peak_from: "2026-12-15"    # ДОПУЩЕНИЕ: пик — последние две недели декабря
  peak_multiplier: 2.5       # ДОПУЩЕНИЕ: продажи в пик к обычному дню (чувствительность 1,5–3,5)

product:
  name: Условная импортная категория
  price_rub: 600             # ДОПУЩЕНИЕ: цена единицы, ₽
  margin: 0.35               # ДОПУЩЕНИЕ: маржа m, доля цены
  markdown: 0.5              # ДОПУЩЕНИЕ: уценка δ остатка после окна, доля цены
  units_per_container: 6000  # ДОПУЩЕНИЕ: единиц в контейнере 40'
  customs_value_rub_per_unit: 150  # ДОПУЩЕНИЕ: таможенная стоимость единицы, ₽

# Условный спрос
demand:
  safety_stock: 0.10         # ДОПУЩЕНИЕ: страховой запас; прогноз сезона = импорт / (1 + запас)
payments:
  p_pay: 0.15                # источник: https://fedpress.ru/personal-view/3435684 — оценка рынка: проблемы примерно у 15 % платежей в Китай
  delay_days: [7, 21]        # ДОПУЩЕНИЕ: задержка старта отгрузки при проблеме с платежом, U(7, 21)
  returned_multiplier: 2     # ДОПУЩЕНИЕ: платеж вернулся — повторная оплата, сдвиг вдвое больше задержки

# Экономика
economics:
  money_rate: 0.14           # стоимость денег r = ключевая ставка (нижняя граница)
# Имитационная модель
sim:
  supply_window: [-35, 20]   # ДОПУЩЕНИЕ: плановое прибытие контейнеров на точки входа — с 27 сентября по 21 ноября (t от 1 ноября)
  daily_noise_sigma: 0.10    # ДОПУЩЕНИЕ: σ дневного шума спроса
  p0_overorder_range: [0.10, 0.20]   # ДОПУЩЕНИЕ: завышение заявок регионов — равномерно 10–20 % ; в v5 — заявки региональных планировщиков в S&OE без агентов (агенты регионов — по прогнозу без завышения)
  rail_rub_per_km: 60        # ДОПУЩЕНИЕ: ж/д перевозка 40' внутри страны, ₽ за км пути (чувствительность 40–100)
  donor_cover_days: 21       # ДОПУЩЕНИЕ: P0 берет остатки у региона, у которого больше 21 дня покрытия
# Монте-Карло и сетка чувствительности
experiments:
  stress: {shock: 0.30, wave_delay: 10}   # стресс-сценарий: спрос на Урале +30 %, волна контейнеров задерживается на 10 дней
  wave: [-5, 10]             # ДОПУЩЕНИЕ: задержка касается контейнеров, плановое прибытие которых на основную точку входа — с 27 октября по 11 ноября
# Люди, статусы, языковая модель, стоимость агентов (основа модели)
v4:
  volume:
    containers_base: 500             # ДОПУЩЕНИЕ: модельный поток — 500 контейнеров 40' за 120 дней
  network_a:                         # сеть A «через хаб» — схема со слов эксперта, в модели допущение
    hub_handling_days: 2             # как в v3: разбор контейнера в хабе, сут
  statuses:
    per_week: 2                      # ДОПУЩЕНИЕ: статусных сообщений на контейнер в неделю, пока он в пути до хаба (1–5)
    sender_delay_days: 1             # ДОПУЩЕНИЕ: задержка отправителя, сут; одинакова для всех правил (0–3)
    loss_q: 0.10                     # ДОПУЩЕНИЕ: статус без языковой модели теряется с вероятностью q , 0–0,3
    reported_delay_sigma: 0.30       # ДОПУЩЕНИЕ: ошибка экспедитора в оценке задержки, σ логнормальная (0,15–0,5)

  people:
    hours_per_day: 8
    workdays: [0, 1, 2, 3, 4]        # понедельник — пятница
    routine_hours_per_container: 3   # ДОПУЩЕНИЕ: обычная работа центра импорта по контейнеру (заказ, документы, таможня, оплата) — при любом правиле, сначала (1–6)
    status_minutes: 5                # прочитать и внести статус (2–15 мин)
    event_hours: 1.5                 # разобрать событие людьми (0,5–3 ч)
    event_hours_rules_agents: 0.3    # ДОПУЩЕНИЕ (таблица 5.12): варианты считают агенты, человек проверяет
    event_hours_llm: 0.2             # таблица 5.12
    rho_target: 0.7                  # штат подбирается так, чтобы в P0 при базовом объеме ρ ≈ 0,7
  llm:
    error_rate: 0.10                 # ДОПУЩЕНИЕ: доля ошибок разбора (5–20 %)
    error_mix: {missed: 0.25, wrong_date: 0.25, false_event: 0.25, unsure: 0.25}   # ДОПУЩЕНИЕ: виды ошибок поровну
    false_event_hours: 0.2           #
    unsure_hours: 1.5                #

  lost_sales_estimate:               # оценка потерянных продаж L̂ (P2a, P2)
    bias: -0.15                      # ДОПУЩЕНИЕ: смещение (−30…0 %): оценка по нулевым остаткам занижает потери
    sigma: 0.30                      # ДОПУЩЕНИЕ: разброс (10–50 %)
  corridor:                          #
    limit_rub: 250000                # гибкий: лимит решения региона по расходам (100–500 тыс. ₽)
    eta_threshold_days: 3            # гибкий: порог сдвига срока для события (3–7 сут)
    donor_protect_days: 21           # жесткий: у донора остается прогноз продаж на min(21, дней до конца окна)
    event_cooldown_days: 7           # ДОПУЩЕНИЕ: новое событие по региону — не раньше чем через 7 дней после решения
  agents_cost:                       # стоимость работы агентов (сервер, поддержка, токены GigaChat)
    server_rub_month: 15000          # ДОПУЩЕНИЕ: сервер агентов, ₽ в месяц (5–30 тыс.)
    support_fte: 0.25                # ДОПУЩЕНИЕ: поддержка агентов, доля ставки разработчика (0,1–0,5)
    developer_rub_month: 325000      # ДОПУЩЕНИЕ: разработчик с взносами, ₽ в месяц (250–400 тыс.)
    tokens_per_event: 17000          # измерено: среднее по записанным разборам GigaChat (backend, режим записи)
    llm_rub_per_1k: 0.533            # источник: https://developers.sber.ru/docs/ru/gigachat/tariffs/legal-tariffs — GigaChat 2 Max, 0,65 ₽ за 1 000 токенов с НДС (29.09.2026); без НДС 22 %
  sim:
    p0_reaction_lag_days: 7          # как в v3: P0 перебрасывает запас через 7 дней после начала дефицита
    rail_speed_km_day: 600           # как в v3 (geography.rail_speed_km_day)
  experiments:
    runs: 500                        #
    grid_runs: 200                   #
# Модель v5: общая система импорта, таможня, СВХ, каналы информации, сценарии рычагов
v5:
  federal_rc: "федеральный ТЦ"           # федеральный ТЦ  — сюда приходит импорт
  general:                         # общая система импорта (решение владельца 11.10.2026): непрерывный поток круглый год, бережливый запас
    end: "2027-02-28"              # горизонт расчета 120 дней (1 ноября — 28 февраля)
    peak_multiplier: 1.0           # без сезонного пика: категории круглого года
    safety_stock: 0.0              # закупка равна прогнозу спроса (без запаса на сезон)
    supply_window: [-35, 96]       # контейнеры приходят на границу равномерно; в федеральный ТЦ — примерно с −11 по 120 день: запас в пути и на складе около 10 дней продаж
    markdown: 0.0                  # товар круглого года: остаток не уценивается, стоит денег в запасе (economics.money_rate)
  demo_day: 72                     # дата демонстрации на сайте — 12 января 2027 (день 72 от 1 ноября): K-382 на дополнительной проверке, выпуск под обеспечение выгоден
  truck_max_km: 1500               # ДОПУЩЕНИЕ: до 1 500 км от федерального ТЦ — автомобилем, дальше — ж/д (1 000–2 000)
  rail_handling_days: 2            # ДОПУЩЕНИЕ: погрузка и выгрузка ж/д отправки от федерального ТЦ, сут
  channels:                        # откуда агенты узнают о задержке и что могут прочитать (решение владельца 11.10.2026)
    structured_share: 0.4          # ДОПУЩЕНИЕ: доля новостей о задержке в структурированном виде (трекинг по API, EDI, статусы на сайтах терминалов и РЖД) — их читают правила; остальное — письма экспедиторов и брокеров, PDF, мессенджеры — читает только языковая модель (0,2–0,7)
    structured_share_range: [0.2, 0.7]
    doc_template_share: 0.5        # ДОПУЩЕНИЕ: доля комплектов документов в стандартной форме, которую сверяет OCR по шаблону; свободные формы поставщиков и сканы сверяет только языковая модель (0,3–0,8)
    doc_template_share_range: [0.3, 0.8]
  risk:
    scenarios: 16                  # сценариев прихода для ожидаемой выгоды рычага у агентов (вместо одной точки срока)
  demand:
    level_sigma: 0.20              # ДОПУЩЕНИЕ: разброс спроса РЦ к плану, σ логнормальная (у РЦ меньше магазинов, чем у округа; v3 — 0,15 для округа)
  hub:
    review_days: 2                 # ДОПУЩЕНИЕ: федеральный ТЦ пересматривает отгрузки регионам каждые 2 дня (1–7)
    safety_days: 5                 # ДОПУЩЕНИЕ: страховой запас регионального РЦ, дней продаж (3–10)
    lp_horizon_days: 21            # оркестратор: горизонт скользящего плана отгрузок из федерального ТЦ, сут
    lp_safety_weight: 0.5          # ДОПУЩЕНИЕ: штраф за недобор до страхового запаса — доля маржи за единицу
  eta:                             # синтетический «мир сроков» и обучение ML-агентов сроков
    history_seasons: 3             # синтетическая история: 3 прошлых сезона
    history_per_season: 600
    congestion_rho: 0.9            # ДОПУЩЕНИЕ: загрузка порта или перехода сегодня похожа на вчерашнюю (AR(1))
    ext:                           # ДОПУЩЕНИЕ: задержка до границы = max(0, база + 2,5 × загрузка + 3 × шум), сут
      base: [2.0, 3.0, 4.0, 3.0, 3.0]   # по точкам входа в порядке data/gateways.csv
      beta: 2.5
      sigma: 3.0
    svh:                           # ожидание вывоза с СВХ (погрузки на ж/д) = гладкий max(0, база + 3,5 × загрузка + 2,5 × шум), сут
      # база по точкам входа: Владивосток 8 (от 8 до 11 сут, STALOGISTIC 07.10.2026; 6–10, «Интер-Фрейт» 08.2025),
      # Забайкальск 10 (перегруз 7–18, STALOGISTIC 07.10.2026), Озинки 8 (Достык 5–12, там же), СПб и Новороссийск 3 (ДОПУЩЕНИЕ)
      base: [8.0, 10.0, 8.0, 3.0, 3.0]
      beta: 3.5
      sigma: 2.5
    internal_sigma: 0.08           # ДОПУЩЕНИЕ: разброс срока ж/д до федерального ТЦ, доля
  customs:                         # источники — docs/sources.md
    release_days: 1                # ТК ЕАЭС, ст. 119: выпуск за 4 часа, при запросе документов — 1 рабочий день; ФТС 2025: 51 мин на операции
    check_share: 0.07              # ДОПУЩЕНИЕ по докладу ФТС за 2025 год: 276 тыс. ДТ с изменением стоимости из 3,88 млн — около 7 %, верхняя граница
    check_share_range: [0.03, 0.12]
    check_days: [5, 14]            # ДОПУЩЕНИЕ: продление выпуска до 10 рабочих дней (ТК ЕАЭС, ст. 119 –8) — до 14 календарных
    doc_error_share: 0.03          # ДОПУЩЕНИЕ: возвраты ДТ по ошибкам — около 1,5 % в день (ФТС 2025); доля поставок с ошибкой, задерживающей выпуск
    doc_error_share_range: [0.015, 0.08]
    doc_error_days: [1, 3]         # ДОПУЩЕНИЕ: исправить и подать заново, сут
    ocr_catch: 0.8                 # ДОПУЩЕНИЕ: агент таможни находит ошибку до подачи в 80 % случаев
    guarantee_days: 1              # выпуск под обеспечение — в общий срок выпуска (ТК ЕАЭС, ст. 119, 121)
    customs_value_rub: 150         # таможенная стоимость единицы (product.customs_value_rub_per_unit, допущение)
    duty_rate: 0.08                # ДОПУЩЕНИЕ: пошлина условной товарной категории — 8 % (диапазон 0–20 %)
    vat: 0.22                      # НДС на ввоз с 2026 года (425-ФЗ)
    guarantee_rate_year: 0.02      # банковская гарантия в пользу таможни: ВТБ — от 0,9 % годовых (2026); рынок 1–3 % (РБК, 2017) — ДОПУЩЕНИЕ 2 %
    guarantee_min_days: 90         # проверка после выпуска: документы до 60 дней + проверка до 30 дней (ТК ЕАЭС, ст. 325 –16)
    guarantee_fee_rub: 0           # разовой платы в открытых тарифах не найдено
  svh:
    priority_wait_days: 2          # ДОПУЩЕНИЕ: при ускоренной отправке — 2 сут (взвешивание и отправка «от 2 суток», STALOGISTIC 07.10.2026)
    priority_fee_rub: 50000        # ДОПУЩЕНИЕ: платной приоритетной погрузки в открытых тарифах нет; ориентир — ускоренный контейнерный поезд ВМПП 458 476 ₽ с НДС за 40' (с 01.10.2026); надбавка к обычной отправке 20–150 тыс. ₽
    priority_fee_range: [20000, 150000]
    free_days: 8                   # ВМТП: бесплатное хранение импортного контейнера 8 суток (тариф с 11.10.2026)
    storage_rub_day: 4900          # ВМТП: 40' груженый, с 9-х по 19-е сутки, ₽ в сутки без НДС
    storage_rub_day_after: 10600   # ВМТП: с 20-х суток
